<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#g2)" stroke="url(#g1)" stroke-width="2"/>
  <!-- Shield body -->
  <path d="M32 10 L48 17 L48 32 C48 42 40 49 32 52 C24 49 16 42 16 32 L16 17 Z"
        fill="url(#g1)" opacity="0.9"/>
  <!-- Check mark -->
  <polyline points="23,33 29,39 41,27"
            fill="none" stroke="#020617" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chain link bottom-left -->
  <circle cx="20" cy="52" r="4" fill="none" stroke="url(#g1)" stroke-width="2"/>
  <!-- Chain link bottom-right -->
  <circle cx="44" cy="52" r="4" fill="none" stroke="url(#g1)" stroke-width="2"/>
  <!-- Chain connector -->
  <line x1="24" y1="52" x2="40" y2="52" stroke="url(#g1)" stroke-width="2"/>
</svg>
