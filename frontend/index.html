    <!-- ═══════════════════════════════════════════
         GDPR COOKIE CONSENT BANNER
         Pure JS/CSS – completely independent of React.
         Stores acceptance in localStorage.
    ════════════════════════════════════════════ -->
    <style>
      #cc-banner {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 99999;
        background: rgba(2, 6, 23, 0.97);
        border-top: 1px solid rgba(0, 242, 254, 0.25);
        backdrop-filter: blur(12px);
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #cc-banner.cc-visible { display: flex; }
      #cc-banner p {
        margin: 0;
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.6;
        flex: 1;
        min-width: 200px;
      }
      #cc-banner a {
        color: #00f2fe;
        text-decoration: underline;
      }
      #cc-accept {
        background: linear-gradient(135deg, #00b4d8, #00f2fe);
        color: #020617;
        border: none;
        border-radius: 10px;
        padding: 10px 22px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        letter-spacing: 0.03em;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      #cc-accept:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(0, 242, 254, 0.35);
      }
      #cc-decline {
        background: transparent;
        color: #64748b;
        border: 1px solid rgba(100,116,139,0.3);
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
    </style>
    <div id="cc-banner" role="dialog" aria-label="Cookie consent">
      <p>
        🍪 We use minimal cookies to keep you logged in and remember your preferences.
        Read our <a href="/privacy-policy.html" target="_blank">Privacy Policy</a> and
        <a href="/terms-of-service.html" target="_blank">Terms of Service</a>.
      </p>
      <div style="display:flex;gap:10px;flex-shrink:0">
        <button id="cc-decline">Decline</button>
        <button id="cc-accept">Accept &amp; Continue</button>
      </div>
    </div>
    <script>
      (function () {
        var COOKIE_KEY = 'cc_consent_v1';
        if (!localStorage.getItem(COOKIE_KEY)) {
          document.getElementById('cc-banner').classList.add('cc-visible');
        }
        document.getElementById('cc-accept').addEventListener('click', function () {
          localStorage.setItem(COOKIE_KEY, 'accepted');
          document.getElementById('cc-banner').style.display = 'none';
        });
        document.getElementById('cc-decline').addEventListener('click', function () {
          localStorage.setItem(COOKIE_KEY, 'declined');
          document.getElementById('cc-banner').style.display = 'none';
        });
      })();
    </script>

    <!-- Google Identity Services for OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
